name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # Public repo on self-hosted Tenki runners: fork PRs never run here (ADR 0020).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: tenki-standard-small-2c-4g
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # Cloudflare Workers Builds' default, so CI builds like production
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
  scraper:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: tenki-standard-small-2c-4g
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m unittest discover -s scraper/tests -t .
